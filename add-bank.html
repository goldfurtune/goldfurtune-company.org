let currentUser=getLoggedUser();
const msg=document.getElementById('msg');
const form=document.getElementById('bankForm');
const btn=document.getElementById('confirmBtn');

function showMsg(text,type){
  msg.textContent=text;
  msg.className='msg show '+type;
}

function setButtonBusy(busy){
  btn.disabled=busy;
  btn.textContent=busy?'Saving…':'Confirm Bank';
}

function loadSaved(){
  if(!currentUser)return;
  const wa=currentUser.withdrawalAccount||{};
  const bank=currentUser.bankName||wa.bankName||'';
  const name=currentUser.bankHolder||wa.accountName||'';
  const number=currentUser.bankAccount||wa.accountNumber||'';

  const select=document.getElementById('bankName');
  // Select the exact saved option after the complete bank list has loaded.
  if(bank) select.value=bank;
  document.getElementById('accountName').value=name;
  document.getElementById('accountNumber').value=number;

  if(bank||name||number){
    document.getElementById('savedBank').textContent=bank||'—';
    document.getElementById('savedName').textContent=name||'—';
    document.getElementById('savedNumber').textContent=number||'—';
    document.getElementById('saved').classList.add('show');
  }
}

if(!currentUser){
  location.replace('login.html');
}else{
  const select=document.getElementById('bankName');
  GF_BANKS.forEach(function(name){
    const o=document.createElement('option');
    o.value=name;
    o.textContent=name;
    select.appendChild(o);
  });
  loadSaved();

  select.addEventListener('change',function(){
    // Keep the selected bank as the actual value submitted, not just display text.
    if(this.selectedIndex>0) this.value=this.options[this.selectedIndex].value;
  });
}

form.addEventListener('submit',async function(e){
  e.preventDefault();
  if(!currentUser)return;

  const bankSelect=document.getElementById('bankName');
  const bankName=String(bankSelect.value||'').trim();
  const accountNumber=document.getElementById('accountNumber').value.replace(/\D/g,'').trim();
  const accountName=document.getElementById('accountName').value.trim();

  if(!bankName){
    showMsg('Please select a bank from the bank list.','err');
    bankSelect.focus();
    return;
  }
  if(!/^\d{10}$/.test(accountNumber)){
    showMsg('Enter a valid 10-digit account number.','err');
    return;
  }
  if(!accountName){
    showMsg('Enter the account name.','err');
    return;
  }

  setButtonBusy(true);
  try{
    // Always fetch the newest customer record before saving so a stale dashboard
    // copy cannot overwrite another recent customer update.
    const data=await fetchBin();
    if(!Array.isArray(data.users)) data.users=[];

    const email=String(currentUser.email||'').trim().toLowerCase();
    const idx=data.users.findIndex(function(u){
      return String(u.email||'').trim().toLowerCase()===email;
    });
    if(idx<0) throw new Error('Customer account not found');

    const user=data.users[idx];
    const now=new Date().toISOString();

    // Store the bank in both the legacy fields and the dedicated withdrawal
    // account object. Withdrawal uses this same confirmed account.
    user.bankName=bankName;
    user.bankAccount=accountNumber;
    user.bankHolder=accountName;
    user.withdrawalAccount={
      bankName:bankName,
      accountNumber:accountNumber,
      accountName:accountName,
      confirmed:true,
      updatedAt:now
    };

    await saveBin(data);

    // Keep the logged-in session synchronized with the saved server record.
    currentUser=user;
    setLoggedUser(user);

    document.getElementById('savedBank').textContent=bankName;
    document.getElementById('savedName').textContent=accountName;
    document.getElementById('savedNumber').textContent=accountNumber;
    document.getElementById('saved').classList.add('show');

    showMsg('Bank account confirmed and added to this customer. It will be used for withdrawals.','ok');
  }catch(err){
    console.error('Add bank failed:',err);
    showMsg('Unable to save bank details. Please check your connection and try again.','err');
  }finally{
    setButtonBusy(false);
  }
});

document.getElementById('accountNumber').addEventListener('input',function(){
  this.value=this.value.replace(/\D/g,'').slice(0,10);
});

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f0c06"><title>Gold Fortune — Welcome Bonus</title><link rel="icon" href="icon-2.png"><link rel="apple-touch-icon" href="icon-1.png"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0b0905;--gold:#e8c547;--text:#fff6dc;--muted:#aa9768}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#5b4619 0,transparent 38%),linear-gradient(150deg,#0b0905,#191307 55%,#0b0905);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}.spark{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,220,100,.75) 0 1px,transparent 1.5px);background-size:58px 58px;opacity:.22;animation:drift 8s linear infinite}@keyframes drift{to{background-position:58px 116px}}.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(480px,100%);position:relative;padding:42px 28px 30px;border:1px solid rgba(232,197,71,.5);border-radius:32px;text-align:center;background:linear-gradient(145deg,rgba(55,43,18,.92),rgba(18,14,8,.96));box-shadow:0 30px 100px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);animation:rise .8s ease both}@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}.logo{width:100px;height:100px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff1a6,#e8c547 45%,#a97d16);color:#171006;font:800 2rem 'Playfair Display',serif;box-shadow:0 0 0 8px rgba(232,197,71,.08),0 0 50px rgba(232,197,71,.35)}.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:.72rem;color:var(--gold)}h1{font:700 2.3rem 'Playfair Display',serif;margin:8px 0}.amount{font:800 3.4rem 'Playfair Display',serif;color:var(--gold);text-shadow:0 0 30px rgba(232,197,71,.25);margin:12px 0}.sub{color:var(--muted);line-height:1.7}.badge{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(232,197,71,.3);background:rgba(232,197,71,.08);border-radius:999px;padding:9px 14px;color:#eadfbf;font-size:.8rem;margin:16px 0}.btn{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,#fff09b,#e8c547 55%,#b98616);color:#191307;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 12px 30px rgba(232,197,71,.18)}.fine{font-size:.72rem;color:#776845;margin-top:15px}.hidden{display:none}.balloon{position:fixed;bottom:-120px;width:44px;height:56px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 30% 24%,#fff6bf,#e8c547 42%,#9d7315);box-shadow:inset -8px -10px 18px rgba(0,0,0,.18),0 8px 28px rgba(232,197,71,.16);animation:balloonUp var(--dur) linear var(--delay) forwards;z-index:1}.balloon:before{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:9px solid #b48618}.balloon:after{content:"";position:absolute;left:50%;top:54px;width:1px;height:120px;background:rgba(232,197,71,.32)}@keyframes balloonUp{0%{transform:translateY(0) translateX(0) rotate(-4deg);opacity:0}8%{opacity:1}50%{transform:translateY(-55vh) translateX(18px) rotate(5deg)}100%{transform:translateY(-125vh) translateX(-18px) rotate(-3deg);opacity:0}}.card{z-index:5}.logo{animation:logoPulse 2.6s ease-in-out infinite}@keyframes logoPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 8px rgba(232,197,71,.08),0 0 50px rgba(232,197,71,.35)}50%{transform:scale(1.045);box-shadow:0 0 0 14px rgba(232,197,71,.06),0 0 80px rgba(232,197,71,.48)}}</style><link rel="stylesheet" href="premium.css"></head><body><div class="spark"></div><div id="balloons" aria-hidden="true"></div><main class="wrap"><section class="card"><div class="logo">GF</div><div class="eyebrow">Exclusive Welcome</div><h1>Welcome to Gold Fortune</h1><div class="amount">₦5,000</div><p class="sub">Your first-registration welcome bonus has been added to your wallet. This premium welcome screen appears only for your first registration.</p><div class="badge">✦ First-time bonus confirmed</div><button class="btn" id="dismiss">Continue to Dashboard</button><p class="fine">You can dismiss this page at any time to continue.</p></section></main><script src="app.js"></script><script>const balloons=document.getElementById('balloons');for(let i=0;i<11;i++){const x=document.createElement('span');x.className='balloon';x.style.left=(3+Math.random()*94)+'%';x.style.setProperty('--dur',(8+Math.random()*8)+'s');x.style.setProperty('--delay',(Math.random()*6)+'s');x.style.transform='scale('+(0.72+Math.random()*.55)+')';balloons.appendChild(x)}const u=getLoggedUser();if(!u||!u.firstTime){location.href='dashboard.html'}document.getElementById('dismiss').onclick=async()=>{const b=document.getElementById('dismiss');b.disabled=true;b.textContent='Opening Dashboard…';try{const d=await fetchBin();const i=d.users.findIndex(x=>x.email===u.email);if(i>=0){d.users[i].firstTime=false;d.users[i].bonusSeen=true;await saveBin(d);setLoggedUser(d.users[i])}}catch(e){}location.href='dashboard.html'};</script></body></html>

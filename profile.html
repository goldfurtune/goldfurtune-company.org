<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f0c06"><title>Gold Fortune — Profile</title><link rel="icon" href="icon-2.png"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0f0c06;--card:#1c1710;--border:#4a3c24;--gold:#e8c547;--text:#f5eedc;--muted:#a79778}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:DM Sans,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:22px 16px 48px}.top{display:flex;align-items:center;gap:14px;margin:8px 0 28px}.back{width:44px;height:44px;border:1px solid var(--border);border-radius:13px;display:grid;place-items:center;color:var(--gold);text-decoration:none;font-size:30px}.top h1{font:700 2rem 'Playfair Display',serif;margin:0}.card{background:linear-gradient(145deg,#272016,#19140d);border:1px solid rgba(232,197,71,.32);border-radius:24px;padding:24px;margin-bottom:16px}.title{font:700 1.6rem 'Playfair Display',serif;margin:0 0 16px}.info{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid rgba(232,197,71,.12)}.info:last-child{border-bottom:0}.label{color:var(--muted)}.value{font-weight:700;word-break:break-word}.code{font:700 1.7rem 'Playfair Display',serif;color:var(--gold);letter-spacing:2px}.btn{width:100%;min-height:52px;border-radius:15px;border:1px solid var(--gold);background:linear-gradient(180deg,#ffc936,#e9ad1f);color:#171207;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:12px;cursor:pointer}.btn.outline{background:transparent;color:var(--gold)}@media(max-width:520px){.info{grid-template-columns:1fr}.wrap{padding-left:14px;padding-right:14px}}</style><link rel="stylesheet" href="premium.css"></head><body><main class="wrap"><div class="top"><a class="back" href="dashboard.html">‹</a><h1>Profile</h1></div><section class="card"><h2 class="title">Customer Profile</h2><div class="info"><span class="label">Name</span><span class="value" id="full">—</span></div><div class="info"><span class="label">Email address</span><span class="value" id="email">—</span></div><div class="info"><span class="label">Date joined</span><span class="value" id="joined">—</span></div><div class="info"><span class="label">Status</span><span class="value" id="status">Active</span></div><div class="info"><span class="label">Customer ID</span><span class="value" id="id">—</span></div></section><section class="card"><h2 class="title">Referral</h2><div class="info"><span class="label">Unique referral code</span><span class="value code" id="ref">—</span></div><button class="btn" id="copy">Copy Referral Code</button></section><section class="card"><h2 class="title">Bank Details</h2><div class="info"><span class="label">Bank name</span><span class="value" id="bank">Not set</span></div><div class="info"><span class="label">Account number</span><span class="value" id="acct">Not set</span></div><div class="info"><span class="label">Account name</span><span class="value" id="holder">Not set</span></div></section><a class="btn" href="add-bank.html">Add / Update Bank Account</a><a class="btn outline" href="dashboard.html">Return to Dashboard</a><button class="btn outline" onclick="clearLoggedUser();location.replace('login.html')">Logout</button></main><script src="app.js"></script><script>let u=getLoggedUser();if(!u){location.replace('login.html')}else{document.getElementById('full').textContent=u.fullName||'—';document.getElementById('email').textContent=u.email||'—';document.getElementById('joined').textContent=u.joined?new Date(u.joined).toLocaleDateString():'—';document.getElementById('status').textContent=u.status||'Active';document.getElementById('id').textContent=u.id||'—';document.getElementById('ref').textContent=u.referralCode||'—';var wa=u.withdrawalAccount||{};document.getElementById('bank').textContent=u.bankName||wa.bankName||'Not set';document.getElementById('acct').textContent=u.bankAccount||wa.accountNumber||'Not set';document.getElementById('holder').textContent=u.bankHolder||wa.accountName||u.fullName||'Not set'}document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(document.getElementById('ref').textContent).then(()=>alert('Referral code copied')).catch(()=>{});</script></body></html>

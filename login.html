<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#d4a536" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gold Fortune" />
  <title>Gold Fortune – Sign In</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-2.png" />
  <link rel="apple-touch-icon" href="icon-1.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: 40 20% 8%; --foreground: 43 80% 85%; --card: 40 18% 12%;
      --primary: 43 90% 55%; --muted-foreground: 40 20% 55%; --border: 43 30% 25%;
      --input: 43 20% 20%; --radius: 0.75rem;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background-color: hsl(var(--background)); color: hsl(var(--foreground));
      font-family: "DM Sans", sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    h1 { font-family: "Playfair Display", serif; }
    .container { width: 100%; max-width: 420px; text-align: center; }
    .logo { font-size: 2.4rem; font-weight: 700; color: #e8c547; margin-bottom: 8px; }
    .subtitle { color: hsl(var(--muted-foreground)); font-size: 0.95rem; margin-bottom: 32px; }
    .card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius); padding: 28px 24px; text-align: left; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    input {
      width: 100%; height: 44px; background: hsl(var(--input)); border: 1px solid hsl(var(--border));
      border-radius: 8px; padding: 0 14px; color: hsl(var(--foreground)); font-size: 0.95rem; outline: none;
    }
    input:focus { border-color: hsl(var(--primary)); }
    input::placeholder { color: hsl(var(--muted-foreground)); }
    .toggle-password {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: hsl(var(--muted-foreground)); cursor: pointer; font-size: 1.1rem; padding: 4px;
    }
    .btn-primary {
      width: 100%; height: 48px; background: #e8c547; color: #1a1408; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .btn-primary:hover { background: #f0d060; }
    .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }
    .footer-text { text-align: center; margin-top: 20px; font-size: 0.9rem; color: hsl(var(--muted-foreground)); }
    .footer-text a { color: #e8c547; text-decoration: none; font-weight: 500; }
    .msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; display: none; }
    .msg.success { background: rgba(39,174,96,0.15); color: #2ecc71; display: block; }
    .msg.error { background: rgba(231,76,60,0.15); color: #e74c3c; display: block; }
  </style>
<link rel="stylesheet" href="premium.css"></head>
<body>
  <div class="container">
    <h1 class="logo">Gold Fortune</h1>
    <p class="subtitle">Welcome back, sign in to continue</p>
    <div class="card">
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Enter your password" required />
            <button type="button" class="toggle-password" onclick="togglePassword('password')">👁</button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
        <div class="msg" id="msg"></div>
      </form>
      <p class="footer-text">Don't have an account? <a href="signup.html">Create Account</a></p>
    </div>
  </div>

  <div id="premiumLoader" class="premium-loader"><div class="loader-orbit"></div><div class="loader-logo">GF</div><div class="loader-title">Gold Fortune</div><div class="loader-sub">Securely opening your account</div><div class="loader-bar"><i id="loaderBar"></i></div><div class="loader-time" id="loaderTime">0%</div></div><style>.premium-loader{position:fixed;inset:0;z-index:9999;display:none;place-items:center;align-content:center;gap:10px;background:radial-gradient(circle at center,#4b3812,#100c06 55%,#080704);text-align:center}.premium-loader.show{display:grid}.loader-orbit{position:absolute;width:210px;height:210px;border:1px solid rgba(232,197,71,.2);border-top-color:#e8c547;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loader-logo{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff0a0,#e8c547,#a67612);color:#171006;font:800 2rem 'Playfair Display',serif;box-shadow:0 0 40px rgba(232,197,71,.28)}.loader-title{font:700 1.6rem 'Playfair Display',serif;color:#e8c547}.loader-sub,.loader-time{color:#aa9768;font-size:.82rem}.loader-bar{width:220px;height:5px;background:#302612;border-radius:99px;overflow:hidden;margin-top:5px}.loader-bar i{display:block;width:0;height:100%;background:#e8c547;transition:width .1s linear}</style><script src="app.js"></script><script>
if(getLoggedUser()) location.href='dashboard.html';function premiumThen(url){const l=document.getElementById('premiumLoader'),bar=document.getElementById('loaderBar'),pct=document.getElementById('loaderTime');l.classList.add('show');let s=0;const t=setInterval(()=>{s++;bar.style.width=(s/60*100)+'%';pct.textContent=Math.round(s/60*100)+'%';if(s>=60){clearInterval(t);location.href=url}},100)}
document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');msg.className='msg';msg.style.display='none';btn.disabled=true;btn.textContent='Signing in...';try{const data=await fetchBin();const user=(data.users||[]).find(u=>u.email===email&&u.password===password);if(!user){msg.className='msg error';msg.textContent='Invalid email or password';btn.disabled=false;btn.textContent='Sign In';return}setLoggedUser(user);premiumThen('dashboard.html')}catch(err){console.error(err);msg.className='msg error';msg.textContent='Something went wrong. Please try again.';btn.disabled=false;btn.textContent='Sign In'}});</script></body></html>

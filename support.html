<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f0c06"><title>Gold Fortune — Support</title><link rel="icon" href="icon-2.png"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0f0c06;--card:#1c1710;--border:#4a3c24;--gold:#e8c547;--text:#f5eedc;--muted:#a79778}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 320px at 50% 0,rgba(232,197,71,.1),transparent 70%),var(--bg);color:var(--text);font-family:DM Sans,sans-serif}.wrap{width:min(720px,100%);margin:auto;padding:22px 16px 48px}.top{display:flex;align-items:center;gap:14px;margin:8px 0 28px}.back{width:44px;height:44px;border:1px solid var(--border);border-radius:13px;display:grid;place-items:center;color:var(--gold);text-decoration:none;font-size:30px}.top h1{font:700 2rem 'Playfair Display',serif;margin:0}.hero,.support-card{background:linear-gradient(145deg,#272016,#19140d);border:1px solid rgba(232,197,71,.32);border-radius:24px;padding:26px;margin-bottom:16px}.hero h2{font:700 1.7rem 'Playfair Display',serif;margin:8px 0}.hero p{color:var(--muted);line-height:1.6}.eyebrow{color:var(--gold);font-size:.72rem;letter-spacing:2px;text-transform:uppercase}.support-card{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text);min-height:88px}.support-card:hover{border-color:var(--gold)}.support-icon svg{width:32px;height:32px;display:block}.support-icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#241d13;border:1px solid rgba(232,197,71,.35);font-size:30px;flex:none}.support-card strong{font-size:1.05rem}.support-card span{display:block;color:var(--muted);font-size:.84rem;margin-top:4px}.empty{color:var(--muted);text-align:center;padding:24px}@media(max-width:480px){.wrap{padding-left:14px;padding-right:14px}.hero,.support-card{padding:22px}}</style><link rel="stylesheet" href="premium.css"></head><body><main class="wrap"><div class="top"><a class="back" href="dashboard.html">‹</a><h1>Support</h1></div><section class="hero"><div class="eyebrow">Customer Care</div><h2>How can we help?</h2><p>Choose a support channel below. WhatsApp and Telegram open the configured service directly in the appropriate app or browser.</p></section><div id="links"><div class="empty">Loading support…</div></div></main><script src="app.js"></script><script>function card(href,icon,title,sub){return `<a class="support-card" href="${href}" target="_blank" rel="noopener noreferrer"><div class="support-icon">${icon}</div><div><strong>${title}</strong><span>${sub}</span></div></a>`}fetchBin().then(d=>{const s=d.settings||{},box=document.getElementById('links');let h='';if(s.whatsapp)h+=card(s.whatsapp,'<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M16 4a11 11 0 0 0-9.4 16.7L5 28l7.5-1.6A11 11 0 1 0 16 4Z"/><path fill="currentColor" d="M12.3 10.6c.4-.4 1-.4 1.3.1l1 1.7c.2.4.2.8-.1 1.1l-.8.8c.7 1.4 1.8 2.5 3.2 3.2l.8-.8c.3-.3.7-.3 1.1-.1l1.7 1c.5.3.5.9.1 1.3l-.7.7c-.7.7-1.8 1-2.8.7-4.1-1.1-7.5-4.5-8.6-8.6-.3-1 0-2.1.7-2.8l.7-.7Z"/></svg>','WhatsApp','Open WhatsApp support');if(s.telegram)h+=card(s.telegram,'<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M28.5 5.8 24 26c-.3 1.4-1.1 1.7-2.2 1.1l-6-4.4-2.9 2.8c-.3.3-.5.5-1.1.5l.4-6.1L23.3 9.2c.5-.4-.1-.6-.8-.2l-13.7 8.6-5.9-1.9c-1.3-.4-1.3-1.3.3-1.9L26.3 4c1.1-.4 2.1.2 2.2 1.8Z"/></svg>','Telegram','Message support on Telegram');box.innerHTML=h||'<div class="empty">Support channels have not been configured yet.</div>'}).catch(()=>document.getElementById('links').innerHTML='<div class="empty">Unable to load support links.</div>');if(!getLoggedUser())location.replace('login.html');</script></body></html>

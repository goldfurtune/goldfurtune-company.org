<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f0c06"><title>Gold Fortune — Platform</title><link rel="icon" href="icon-2.png"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0f0c06;--card:#1c1710;--border:#4a3c24;--gold:#e8c547;--text:#f5eedc;--muted:#a79778}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 320px at 50% 0,rgba(232,197,71,.1),transparent 70%),var(--bg);color:var(--text);font-family:DM Sans,sans-serif}.wrap{width:min(720px,100%);margin:auto;padding:22px 16px 48px}.top{display:flex;align-items:center;gap:14px;margin:8px 0 28px}.back{width:44px;height:44px;border:1px solid var(--border);border-radius:13px;display:grid;place-items:center;color:var(--gold);text-decoration:none;font-size:30px}.top h1{font:700 2rem 'Playfair Display',serif;margin:0}.card{background:linear-gradient(145deg,#272016,#19140d);border:1px solid rgba(232,197,71,.32);border-radius:24px;padding:26px;margin-bottom:16px}.eyebrow{color:var(--gold);font-size:.72rem;letter-spacing:2px;text-transform:uppercase}.title{font:700 1.7rem 'Playfair Display',serif;margin:8px 0}.desc{color:var(--muted);line-height:1.65}.channel{display:flex;gap:15px;align-items:center}.tg{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;border:1px solid rgba(232,197,71,.4);font-size:32px;color:var(--gold);background:#211a10}.btn{width:100%;min-height:52px;border-radius:15px;border:1px solid var(--gold);background:linear-gradient(180deg,#ffc936,#e9ad1f);color:#171207;font-weight:800;text-decoration:none;display:flex;align-items:center;justify-content:center;margin-top:16px}.btn.outline{background:transparent;color:var(--gold)}</style><link rel="stylesheet" href="premium.css"></head><body><main class="wrap"><div class="top"><a class="back" href="dashboard.html">‹</a><h1>Platform</h1></div><section class="card"><div class="eyebrow">Official Updates</div><div class="channel"><div class="tg">➤</div><div><div class="title">Telegram Channel</div><div class="desc">Follow the configured channel for platform announcements, updates and notices.</div></div></div><div id="channelBox"></div></section><section class="card"><div class="eyebrow">Payment Account</div><div class="desc" id="bankBox">Loading…</div></section><a class="btn outline" href="dashboard.html">Return to Dashboard</a></main><script src="app.js"></script><script>fetchBin().then(d=>{const s=d.settings||{};const b=document.getElementById('bankBox');b.innerHTML=`<b>${s.bankName||'—'}</b><br>${s.accountName||'—'}<br>${s.bankAccount||'—'}`;const c=document.getElementById('channelBox');c.innerHTML=s.telegramChannel?`<a class="btn" href="${s.telegramChannel}" target="_blank" rel="noopener">Open Telegram Channel</a>`:'<div class="desc" style="margin-top:14px">Telegram channel is not configured yet.</div>'}).catch(()=>{});if(!getLoggedUser())location.replace('login.html');</script></body></html>
